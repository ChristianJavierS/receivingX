name: receivingX

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: receivingx
      POSTGRES_PASSWORD: receivingx
      POSTGRES_DB: receivingx
    # Not published to the host by default - only `server` needs it, over the
    # compose network (postgres:5432). Uncomment to reach it from the host
    # (e.g. psql/Prisma Studio):
    # ports:
    #   - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receivingx"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # The S3 API port (9000) is internal-only (minio:9000) - only `server`
    # calls it. The console (9001) is published so an admin can browse the
    # bucket; override MINIO_CONSOLE_PORT if 9001 is taken on the host.
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/receivingx &&
      mc anonymous set download local/receivingx/labels
      "
    restart: "no"

  ocr:
    build:
      context: services/ocr
    init: true
    restart: unless-stopped
    # Not published to the host by default - internal-only (ocr:8100), only
    # `server` calls it. Uncomment to hit it directly for debugging:
    # ports:
    #   - "${OCR_PORT:-8100}:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time - must be the URL a
        # browser can actually reach (not the internal `server:3000` name).
        # Override via WEB_PUBLIC_SERVER_URL in a root .env for real deploys.
        NEXT_PUBLIC_SERVER_URL: ${WEB_PUBLIC_SERVER_URL:-http://localhost:3000}
    init: true
    ports:
      - "${WEB_PORT:-3001}:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      # Used for the app's own SSR-side fetches, which run inside the
      # compose network and should use the internal service name.
      NEXT_PUBLIC_SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    ports:
      - "${SERVER_PORT:-3000}:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      # CORS_ORIGIN must be the web app's public origin (what the browser
      # sends as Origin). Override via WEB_PUBLIC_ORIGIN in a root .env for
      # real deploys (BETTER_AUTH_URL/APP_URL belong in apps/server/.env).
      # DATABASE_URL/S3/OCR are always the in-network service names.
      CORS_ORIGIN: ${WEB_PUBLIC_ORIGIN:-http://localhost:3001}
      DATABASE_URL: postgresql://receivingx:receivingx@postgres:5432/receivingx
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      OCR_URL: http://ocr:8100
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
